# Regras do Ecossistema
# Versão: 1.0
# Data: 2026-01-31


regras:
  operacao:
    - id: R-OP-01
      modulo: rastreador
      categoria: operacao
      condicao: "sources_collected >= max_sources"
      acao: parar
      prioridade: alta
      descricao: Para quando atinge max_sources

    - id: R-OP-02
      modulo: rastreador
      categoria: operacao
      condicao: "sources_per_hour < 10"
      acao: parar
      prioridade: alta
      descricao: Para quando min_new_sources_per_hour < 10

    - id: R-OP-03
      modulo: rastreador
      categoria: operacao
      condicao: "hours_without_new >= 4"
      acao: parar
      prioridade: alta
      descricao: Para quando max_hours_without_new > 4

    - id: R-OP-04
      modulo: rastreador
      categoria: operacao
      condicao: "completeness >= 0.95"
      acao: parar
      prioridade: alta
      descricao: Para quando completeness_threshold >= 0.95

    - id: R-OP-05
      modulo: minerador
      categoria: operacao
      condicao: "artifacts_per_source >= 100"
      acao: parar
      prioridade: alta
      descricao: Para quando max_artifacts_per_source > 100

    - id: R-OP-06
      modulo: minerador
      categoria: operacao
      condicao: "confidence_mean < 0.7"
      acao: parar
      prioridade: alta
      descricao: Para quando min_confidence_mean < 0.7

    - id: R-OP-07
      modulo: minerador
      categoria: operacao
      condicao: "hours_without_new >= 2"
      acao: parar
      prioridade: alta
      descricao: Para quando max_hours_without_new > 2

    - id: R-OP-08
      modulo: minerador
      categoria: operacao
      condicao: "saturation >= 0.9"
      acao: parar
      prioridade: alta
      descricao: Para quando saturation_threshold >= 0.9

    - id: R-OP-09
      modulo: loop
      categoria: operacao
      condicao: "iteration >= 10"
      acao: parar
      prioridade: alta
      descricao: Para quando max_iterations > 10

    - id: R-OP-10
      modulo: loop
      categoria: operacao
      condicao: "improvement < 0.01"
      acao: parar
      prioridade: alta
      descricao: Para quando min_improvement_per_iteration < 0.01

    - id: R-OP-11
      modulo: loop
      categoria: operacao
      condicao: "hours_without_improvement >= 6"
      acao: parar
      prioridade: alta
      descricao: Para quando max_hours_without_improvement > 6

    - id: R-OP-12
      modulo: loop
      categoria: operacao
      condicao: "is_oscillating == true"
      acao: parar
      prioridade: alta
      descricao: Para quando detecta oscilação

    - id: R-OP-13
      modulo: orquestrador
      categoria: operacao
      condicao: "queue_empty >= 5"
      acao: alert
      prioridade: normal
      descricao: Alerta quando queue_empty_threshold > 5min

    - id: R-OP-14
      modulo: orquestrador
      categoria: operacao
      condicao: "failed_tasks_rate > 0.1"
      acao: alert
      prioridade: alta
      descricao: Alerta quando failed_tasks > 10% em 1h

    - id: R-OP-15
      modulo: orquestrador
      categoria: operacao
      condicao: "queue_pending > 1000"
      acao: alert
      prioridade: normal
      descricao: Alerta quando fila está cheia

  qualidade:
    - id: R-QF-01
      modulo: rastreador
      categoria: qualidade
      condicao: "quality_score < 0.7"
      acao: rejeitar
      prioridade: alta
      descricao: Rejeita fontes com quality < 0.7

    - id: R-QF-02
      modulo: rastreador
      categoria: qualidade
      condicao: "is_spam == true"
      acao: rejeitar
      prioridade: alta
      descricao: Rejeita fontes marcadas como spam

    - id: R-QF-03
      modulo: rastreador
      categoria: qualidade
      condicao: "duration < 30"
      acao: rejeitar
      prioridade: normal
      descricao: Rejeita fontes com duration < 30s

    - id: R-QF-04
      modulo: rastreador
      categoria: qualidade
      condicao: "text_length < 100"
      acao: rejeitar
      prioridade: alta
      descricao: Rejeita fontes com text_length < 100

    - id: R-QF-05
      modulo: rastreador
      categoria: qualidade
      condicao: "repetition > 0.3"
      acao: rejeitar
      prioridade: normal
      descricao: Rejeita fontes com repetition > 30%

    - id: R-QA-01
      modulo: minerador
      categoria: qualidade
      condicao: "confidence < 0.5"
      acao: rejeitar
      prioridade: alta
      descricao: Rejeita artefatos com confidence < 0.5

    - id: R-QA-02
      modulo: minerador
      categoria: qualidade
      condicao: "has_author_context == false"
      acao: rejeitar
      prioridade: alta
      descricao: Rejeita artefatos sem author_context

    - id: R-QA-03
      modulo: minerador
      categoria: qualidade
      condicao: "is_duplicate == true"
      acao: rejeitar
      prioridade: alta
      descricao: Rejeita artefatos duplicados

    - id: R-QA-04
      modulo: minerador
      categoria: qualidade
      condicao: "has_text_content == false"
      acao: rejeitar
      prioridade: alta
      descricao: Rejeita artefatos sem text_content

    - id: R-QA-05
      modulo: minerador
      categoria: qualidade
      condicao: "context_depth < 2"
      acao: rejeitar
      prioridade: normal
      descricao: Rejeita artefatos com context_depth < 2

    - id: R-QM-01
      modulo: construtor
      categoria: qualidade
      condicao: "artifacts_count < 50"
      acao: rejeitar
      prioridade: alta
      descricao: Rejeita mentes com artifacts_count < 50

    - id: R-QM-02
      modulo: construtor
      categoria: qualidade
      condicao: "signature_coherence < 0.6"
      acao: rejeitar
      prioridade: alta
      descricao: Rejeita mentes com signature_coherence < 0.6

    - id: R-QM-03
      modulo: construtor
      categoria: qualidade
      condicao: "has_biases == false"
      acao: rejeitar
      prioridade: normal
      descricao: Rejeita mentes sem biases identificados

    - id: R-QM-04
      modulo: construtor
      categoria: qualidade
      condicao: "has_voice_patterns == false"
      acao: rejeitar
      prioridade: normal
      descricao: Rejeita mentes sem voice_patterns

    - id: R-QM-05
      modulo: construtor
      categoria: qualidade
      condicao: "coverage < 0.7"
      acao: rejeitar
      prioridade: alta
      descricao: Rejeita mentes com coverage < 0.7

  decisao:
    - id: R-D-01
      modulo: geral
      categoria: decisao
      condicao: "error_type == transient"
      acao: retry_com_backoff
      max_retries: 3
      prioridade: alta
      descricao: Retry erros transientes com backoff

    - id: R-D-02
      modulo: geral
      categoria: decisao
      condicao: "error_type == rate_limit"
      acao: retry_com_backoff
      max_retries: 5
      prioridade: alta
      descricao: Espera e retry quando rate limit

    - id: R-D-03
      modulo: geral
      categoria: decisao
      condicao: "error_type == permanent"
      acao: alert
      prioridade: alta
      descricao: Não retry, alerta para erros permanentes

    - id: R-D-04
      modulo: geral
      categoria: decisao
      condicao: "error_type == unknown"
      acao: alert
      prioridade: alta
      descricao: Alerta crítico, aborta para erros desconhecidos

    - id: R-D-05
      modulo: rastreador
      categoria: decisao
      condicao: "similarity > 0.95"
      acao: rejeitar
      prioridade: alta
      descricao: Ignora conteúdo duplicado (similarity > 95%)

    - id: R-D-06
      modulo: rastreador
      categoria: decisao
      condicao: "similarity > 0.8 and similarity <= 0.95"
      acao: log
      prioridade: normal
      descricao: Logga near-duplicate (similarity 80-95%)

    - id: R-D-07
      modulo: minerador
      categoria: decisao
      condicao: "is_duplicate == true"
      acao: rejeitar
      prioridade: alta
      descricao: Mantém versão com maior confidence

    - id: R-D-08
      modulo: rastreador
      categoria: decisao
      condicao: "spam_score > 0.5"
      acao: rejeitar
      prioridade: alta
      descricao: Rejeita conteúdo spam

    - id: R-D-09
      modulo: rastreador
      categoria: decisao
      condicao: "source_spam_rate > 0.5"
      acao: alert
      prioridade: normal
      descricao: Marca fonte como suspensa

    - id: R-D-10
      modulo: rastreador
      categoria: decisao
      condicao: "author_spam_rate > 0.5"
      acao: alert
      prioridade: normal
      descricao: Reduz prioridade de fontes desse autor

    - id: R-D-11
      modulo: geral
      categoria: decisao
      condicao: "redis_status != healthy"
      acao: alert
      prioridade: alta
      descricao: Para todas as operações

    - id: R-D-12
      modulo: geral
      categoria: decisao
      condicao: "celery_workers == 0"
      acao: alert
      prioridade: alta
      descricao: Para enfileiramento, alerta crítico

    - id: R-D-13
      modulo: geral
      categoria: decisao
      condicao: "chromadb_status != healthy"
      acao: alert
      prioridade: alta
      descricao: Para buscas, mas continua processando

    - id: R-D-14
      modulo: geral
      categoria: decisao
      condicao: "memory_usage > 0.9"
      acao: alert
      prioridade: alta
      descricao: Para novos processamentos, alerta

    - id: R-D-15
      modulo: geral
      categoria: decisao
      condicao: "disk_free < 0.1"
      acao: alert
      prioridade: alta
      descricao: Para tudo, alerta crítico

  prioridade:
    - id: R-P-01
      modulo: rastreador
      categoria: prioridade
      condicao: "source_type in [canonical]"
      acao: queue_high
      prioridade: alta
      descricao: Fontes canônicas → Fila ALTA

    - id: R-P-02
      modulo: rastreador
      categoria: prioridade
      condicao: "source_type in [regular]"
      acao: queue_normal
      prioridade: normal
      descricao: Fontes regulares → Fila NORMAL

    - id: R-P-03
      modulo: rastreador
      categoria: prioridade
      condicao: "source_type in [exploratory]"
      acao: queue_low
      prioridade: baixa
      descricao: Fontes exploratórias → Fila BAIXA

    - id: R-P-04
      modulo: construtor
      categoria: prioridade
      condicao: "confidence > 0.9"
      acao: queue_high
      prioridade: alta
      descricao: Artefatos com alta confiança → Fila ALTA

    - id: R-P-05
      modulo: construtor
      categoria: prioridade
      condicao: "confidence < 0.7"
      acao: queue_low
      prioridade: baixa
      descricao: Artefatos com baixa confiança → Fila BAIXA

    - id: R-P-06
      modulo: rag
      categoria: prioridade
      condicao: "freshness_score > 0.8"
      acao: prioritize
      prioridade: alta
      descricao: Prioriza embeddings com freshness > 0.8

    - id: R-P-07
      modulo: rag
      categoria: prioridade
      condicao: "is_canonical_author == true"
      acao: prioritize
      prioridade: alta
      descricao: Prioriza artefatos de autores canônicos

    - id: R-P-08
      modulo: rag
      categoria: prioridade
      condicao: "context_depth > 5"
      acao: prioritize
      prioridade: normal
      descricao: Prioriza artefatos com mais context_depth

    - id: R-P-09
      modulo: geral
      categoria: prioridade
      condicao: "project_status == active"
      acao: prioritize
      prioridade: alta
      descricao: Projetos ativos → Processamento prioritário

    - id: R-P-10
      modulo: geral
      categoria: prioridade
      condicao: "project_status == background"
      acao: deprioritize
      prioridade: baixa
      descricao: Projetos em background → Processamento quando recursos livres

configuracoes:
  max_sources: 10000
  min_new_sources_per_hour: 10
  max_hours_without_new: 4
  completeness_threshold: 0.95
  max_artifacts_per_source: 100
  min_confidence_mean: 0.7
  max_hours_without_new_minerador: 2
  saturation_threshold: 0.9
  max_iterations: 10
  min_improvement_per_iteration: 0.01
  max_hours_without_improvement: 6
  quality_threshold: 0.7
  similarity_threshold: 0.95
  freshness_threshold: 0.8
